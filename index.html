  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%235B2116'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-size='40' fill='%23C9A063'%3EM%3C/text%3E%3C/svg%3E">

  <!-- Fonts (as used in the Figma design) -->

  <style>
    /* ---------------------------------------------------------------
       Brand tokens
       --------------------------------------------------------------- */
    :root {
      --brown: #5B2116;
      --gold: #C9A063;
      --gold-light: #F2E3C4;
      --white: #FFFFFF;

      --serif: "Playfair Display SC", "Playfair Display", Georgia, serif;
      --numerals: "Playfair Display", Georgia, serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

      --frame-inset: 26px;
      --pad-x: clamp(32px, 5.6vw, 80px);
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

      /* Spacing scales with viewport HEIGHT so everything fits on one screen */
      --pad-y: clamp(16px, 4.5vh, 48px);
      --space-lg: clamp(14px, 3.6vh, 36px);
      --space-md: clamp(10px, 2.4vh, 24px);
      --space-sm: clamp(8px, 1.8vh, 18px);
      --logo-h: clamp(60px, 12.4vh, 100px);
      --h1-a: clamp(32px, min(3.9vw, 7vh), 56px);   /* "Woven by hand," */
      --h1-b: calc(var(--h1-a) * 1.143);            /* "worn with pride." */
    }

    /* ---------------------------------------------------------------
       Base
       --------------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; }

    html {
      background: var(--brown);          /* no white flash on overscroll */
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--brown);
      color: var(--gold-light);
      font-family: var(--sans);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;

      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: clamp(24px, 4vw, 64px);
      align-items: stretch;
      padding: calc(var(--frame-inset) + var(--pad-y)) calc(var(--frame-inset) + var(--pad-x) * 0.6) calc(var(--frame-inset) + var(--pad-y)) calc(var(--frame-inset) + var(--pad-x));
    }

    a { color: inherit; text-decoration: none; }
    a:focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 4px;
      border-radius: 2px;
    }

    /* Thin inset gold frame (wraps the whole page) */
    .frame {
      position: absolute;
      inset: var(--frame-inset);
      border: 1px solid rgba(201, 160, 99, 0.55);
      pointer-events: none;
      z-index: 2;
    }

    /* ---------------------------------------------------------------
       Left column
       --------------------------------------------------------------- */
    .content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-lg);
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    /* Brand row: logo | divider | "Rajkot – Coming Soon" */
    .brand {
      display: flex;
      align-items: center;
      gap: clamp(14px, 2vw, 28px);
      margin: 0;
    }
    /* LOGO: swap the <img> src (or replace it with an inline SVG) to change the logo */
    .brand img {
      display: block;
      height: var(--logo-h);
      width: auto;
      mix-blend-mode: lighten;           /* hides the PNG's flat brown backdrop */
    }
    .brand .rule {
      width: 1px;
      align-self: stretch;
      margin: 8% 0;
      background: var(--gold);
      opacity: 0.8;
    }
    .brand .where {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(18px, min(2.2vw, 4.2vh), 32px);
      line-height: 1.4;
      color: var(--gold-light);
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-size: var(--h1-a);
      line-height: 1.14;
      color: var(--white);
      overflow-wrap: break-word;
    }
    h1 em {
      display: block;
      font-style: italic;
      font-size: var(--h1-b);
      line-height: 1;
      color: var(--gold);
    }

    .lede {
      max-width: 520px;
      margin: var(--space-md) 0 0;
      font-size: 15px;
      line-height: 1.7;
      color: var(--white);
      opacity: 0.9;
    }

    /* Footer: social + address */
    footer {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space-sm);
    }
    .social {
      display: flex;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .social a {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(201, 160, 99, 0.5);
      color: var(--gold);
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }
    .social a:hover,
    .social a:focus-visible {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--brown);
    }
    .social a:focus-visible { border-radius: 50%; }
    .social svg { width: 18px; height: 18px; }

    address {
      font-style: normal;
      font-size: 12px;
      line-height: 1.7;
      letter-spacing: 0.06em;
      color: var(--gold-light);
      opacity: 0.8;
    }
    address .chunk { display: inline-block; white-space: nowrap; }
    address .phone {
      display: inline-block;
      margin-top: 2px;
      transition: color 0.3s ease;
    }
    address .phone:hover,
    address .phone:focus-visible { color: var(--gold); }

    /* ---------------------------------------------------------------
       Right column — arch photo
       The Figma layer uses the "Luminosity" blend mode over the brown
       background, which gives the photo its warm brown tone.
       The wrapper keeps a matching backdrop so the blend always works.
       --------------------------------------------------------------- */
    .photo {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brown);
    }
    .photo img {
      display: block;
      height: min(706px, calc(100svh - 2 * (var(--frame-inset) + var(--pad-y))));
      width: auto;
      max-width: 100%;
      aspect-ratio: 496 / 706;
      object-fit: contain;
      mix-blend-mode: luminosity;
    }

    /* ---------------------------------------------------------------
       Load animation — fade up, staggered (respects reduced motion)
       --------------------------------------------------------------- */
    @media (prefers-reduced-motion: no-preference) {
      .reveal {
        animation: fadeUp 0.9s var(--ease) both;
        animation-delay: calc(var(--i, 0) * 0.12s);
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: none; }
      }
    }

    /* ---------------------------------------------------------------
       Short screens: tighten so everything stays above the fold
       --------------------------------------------------------------- */
    @media (max-height: 760px) {
      :root {
        --pad-y: clamp(12px, 3vh, 26px);
        --space-lg: clamp(10px, 2.4vh, 22px);
        --space-md: clamp(8px, 1.8vh, 18px);
        --space-sm: clamp(6px, 1.4vh, 14px);
      }
      .lede { font-size: 14px; line-height: 1.6; }
      address { line-height: 1.55; }
      .social a { width: 36px; height: 36px; }
    }

    /* ---------------------------------------------------------------
       Tablet / mobile: single centred column
       --------------------------------------------------------------- */
    @media (max-width: 900px) {
      :root {
        --frame-inset: 12px;
        --pad-x: 24px;
        --h1-a: clamp(30px, min(8.4vw, 5.6vh), 48px);
      }
      /* Stack: logo → photo (fills the spare height) → headline → footer */
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-sm);
        padding: calc(var(--frame-inset) + var(--pad-y)) calc(var(--frame-inset) + 12px);
        text-align: center;
      }
      .content { display: contents; }        /* lets header / main / footer and .photo share one column */
      header  { order: 1; }
      .photo  { order: 2; }
      main    { order: 3; }
      footer  { order: 4; align-items: center; }

      .brand { flex-direction: column; gap: 6px; }
      .brand .rule { display: none; }
      .brand .where { font-size: clamp(15px, 2.8vh, 20px); line-height: 1.3; }
      .brand .where br { display: none; }   /* "Rajkot – Coming Soon" on one line */
      .lede { max-width: 440px; font-size: 14px; }

      /* Photo: centred, takes whatever height is left, never pushes the page */
      .photo {
        flex: 1 1 0;
        min-height: 84px;
        width: 100%;
        max-width: 360px;
      }
      .photo img {
        position: absolute;
        inset: 0;
        margin: auto;
        height: 100%;
        max-height: 420px;
        width: auto;
        max-width: 100%;
      }
    }
    /* Very narrow phones (≈320px) */
    @media (max-width: 340px) {
      :root { --h1-a: 28px; }
      .lede { font-size: 13px; }
    }
    /* Very short phones (iPhone SE-size and below) */
    @media (max-width: 900px) and (max-height: 600px) {
      :root { --logo-h: 52px; --frame-inset: 10px; }
      address { font-size: 11px; }
    }
  </style>
</head>
